name: Deploy Strolling Penguin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CHAT_ROOM_1: ${{ vars.VITE_CHAT_ROOM_1 }}
          VITE_CHAT_ROOM_2: ${{ vars.VITE_CHAT_ROOM_2 }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id') || artifact=''
            if [[ -n "$artifact" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages artifact did not become available" >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
